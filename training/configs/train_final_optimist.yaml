# Phase 5: final Optimist training (winner mixture base 1.0 : synth 1.0)
tag: final_optimist
personality: optimist

data:
  dataset_dir: training/datasets/processed/dataset-v002
  tokenizer_json: training/tokenizer/tokenizer-portable.json
  mixture: { base: 1.0, synth: 1.0 }

train:
  max_steps: 10000
  batch_size: 32
  grad_accum: 2
  lr: 0.0008
  min_lr: 0.00002
  warmup_steps: 300
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  precision: bf16
  eval_every: 500
  log_every: 100
  save_every: 2000
  eval_samples: 200
  seed: 1337
  checkpoint_dir: training/experiments

eval:
  topic: "Should people always pursue their passion?"
  opponent_text: "Passion sounds nice, but most people cannot afford to chase their dreams forever."
  max_new_tokens: 50
  temperature: 0.55
  top_k: 15
  top_p: 0.85
  repetition_penalty: 1.20

